spring:
  application:
    name: dashboard
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:dev}"
  config:
    import: "${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8888}"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bioinformatics_db}
    username: ${SPRING_DATASOURCE_USERNAME:bio_user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  batch:
    job:
      enabled: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:password}

server:
  port: ${SERVER_PORT:0}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}

app:
  audit-pool:
    core-size: 1
    max-size: 10
    queue-capacity: 25
    thread-name-prefix: audit-

  export:
    csv:
      max-rows: 100000
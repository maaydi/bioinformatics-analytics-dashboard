spring:
  application:
    name: export-service
  config:
    import: ""
  cloud:
    config:
      enabled: false
  flyway:
    enabled: false
    create-schemas: true
    schemas:
      - export_data
  jpa:
    hibernate:
      ddl-auto: create-drop
  datasource:
    # Testcontainers auto-starts PostgreSQL via tc: JDBC URL (ContainerDatabaseDriver)
    url: ${TEST_DB_URL:jdbc:tc:postgresql:16:///bio_test?TC_INITSCRIPT=db/init-schema.sql}
    username: ${TEST_DB_USER:bio_user}
    password: ${TEST_DB_PASS:bio_password}
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  batch:
    job:
      enabled: false  # No batch jobs in test
    jdbc:
      initialize-schema: always

eureka:
  client:
    enabled: false
common:
  enabled: true

app:
  export:
    max-rows: 100
    temp-dir: ${java.io.tmpdir}/bio-export
    pool:
      core-size: 2
      max-size: 10
      queue-capacity: 25
      thread-name-prefix: ExportBatchAsync-

  rate-limiter:
    endpoints:
      - name: export
        capacity: ${APP_RATE_LIMITER_EXPORT_CAPACITY:10}
        tokens: ${APP_RATE_LIMITER_EXPORT_TOKENS:10}
        seconds: ${APP_RATE_LIMITER_EXPORT_SECONDS:60}
      - name: download
        capacity: ${APP_RATE_LIMITER_DOWNLOAD_CAPACITY:20}
        tokens: ${APP_RATE_LIMITER_DOWNLOAD_TOKENS:20}
        seconds: ${APP_RATE_LIMITER_DOWNLOAD_SECONDS:60}
      - name: status
        capacity: ${APP_RATE_LIMITER_STATUS_CAPACITY:120}
        tokens: ${APP_RATE_LIMITER_STATUS_TOKENS:120}
        seconds: ${APP_RATE_LIMITER_STATUS_SECONDS:60}
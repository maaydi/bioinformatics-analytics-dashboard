spring:
  application:
    name: export-service
  config:
    import: ""
  cloud:
    config:
      enabled: false
  flyway:
    enabled: false
    create-schemas: true
    schemas:
      - public
      - export_data
  jpa:
    hibernate:
      ddl-auto: create-drop
  datasource:
    # Testcontainers auto-starts PostgreSQL via tc: JDBC URL (ContainerDatabaseDriver)
    url: ${TEST_DB_URL:jdbc:tc:postgresql:16:///bio_test}
    username: ${TEST_DB_USER:bio_user}
    password: ${TEST_DB_PASS:bio_password}
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

eureka:
  client:
    enabled: false

app:
  export:
    csv:
      max-rows: 100
    temp-dir: ${java.io.tmpdir}/bio-export
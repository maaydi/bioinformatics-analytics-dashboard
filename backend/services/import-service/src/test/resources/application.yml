spring:
  application:
    name: import-service
  config:
    import: ""
  cloud:
    config:
      enabled: false
  flyway:
    enabled: false
    create-schemas: true
    schemas:
      - public
      - import_batch
    default-schema: import_batch
  jpa:
    hibernate:
      ddl-auto: create-drop
  datasource:
    # Testcontainers auto-starts PostgreSQL via tc: JDBC URL (ContainerDatabaseDriver)
    url: ${TEST_DB_URL:jdbc:tc:postgresql:16:///bio_test}
    username: ${TEST_DB_USER:bio_user}
    password: ${TEST_DB_PASS:bio_password}
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

eureka:
  client:
    enabled: false
common:
  enabled: true
  datasource:
    # Testcontainers auto-starts PostgreSQL via tc: JDBC URL (ContainerDatabaseDriver)
    primary-url: ${TEST_DB_URL:jdbc:tc:postgresql:16:///bio_test}
    primary-username: ${TEST_DB_USER:bio_user}
    primary-password: ${TEST_DB_PASS:bio_password}
    replica-url: ${TEST_DB_URL:jdbc:tc:postgresql:16:///bio_test}
    replica-username: ${TEST_DB_USER:bio_user}
    replica-password: ${TEST_DB_PASS:bio_password}
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

app:
  batch:
    chunk-size: ${APP_BATCH_CHUNK_SIZE:250}
    skip-limit: ${APP_BATCH_SKIP_LIMIT:1000}
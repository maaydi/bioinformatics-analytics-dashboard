spring:
  application:
    name: auth-service
  flyway:
    enabled: true
    create-schemas: true
    schemas:
      - public
      - auth
  jpa:
    hibernate:
      ddl-auto: create-drop

eureka:
  client:
    enabled: false
common:
  enabled: true
  datasource:
    # Testcontainers auto-starts PostgreSQL via tc: JDBC URL (ContainerDatabaseDriver)
    primary-url: ${TEST_DB_URL:jdbc:tc:postgresql:16:///bio_test}
    primary-username: ${TEST_DB_USER:bio_user}
    primary-password: ${TEST_DB_PASS:bio_password}
    replica-url: ${TEST_DB_URL:jdbc:tc:postgresql:16:///bio_test}
    replica-username: ${TEST_DB_USER:bio_user}
    replica-password: ${TEST_DB_PASS:bio_password}
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  cache:
    enabled: false

app:
  audit:
    enabled: false
  jwt:
    secret: ${APP_JWT_SECRET:CHANGE_ME_IN_ALL_ENVIRONMENTS}
    issuer: bioinformatics-auth
    audience: bioinformatics-dashboard-clients
    access-token-expiry-seconds: ${APP_JWT_ACCESS_TOKEN_EXPIRY_SECONDS:3600}
    refresh-token-expiry-seconds: ${APP_JWT_REFRESH_TOKEN_EXPIRY_SECONDS:604800}
    service-token-expiry-seconds: 300
    key-bytes-len: 32
  rate-limiter:
    endpoints:
      - name: login
        capacity: ${APP_RATE_LIMITER_LOGIN_CAPACITY:10}
        tokens: ${APP_RATE_LIMITER_LOGIN_TOKENS:10}
        seconds: ${APP_RATE_LIMITER_LOGIN_SECONDS:60}
      - name: refresh
        capacity: ${APP_RATE_LIMITER_REFRESH_CAPACITY:20}
        tokens: ${APP_RATE_LIMITER_REFRESH_TOKENS:20}
        seconds: ${APP_RATE_LIMITER_REFRESH_SECONDS:60}
      - name: logout
        capacity: ${APP_RATE_LIMITER_LOGOUT_CAPACITY:30}
        tokens: ${APP_RATE_LIMITER_LOGOUT_TOKENS:30}
        seconds: ${APP_RATE_LIMITER_LOGOUT_SECONDS:60}
      - name: change-password
        capacity: ${APP_RATE_LIMITER_CHANGE_PASSWORD_CAPACITY:5}
        tokens: ${APP_RATE_LIMITER_CHANGE_PASSWORD_TOKENS:5}
        seconds: ${APP_RATE_LIMITER_CHANGE_PASSWORD_SECONDS:60}
      - name: service-token
        capacity: ${APP_RATE_LIMITER_SERVICE_TOKEN_CAPACITY:5}
        tokens: ${APP_RATE_LIMITER_SERVICE_TOKEN_TOKENS:5}
        seconds: ${APP_RATE_LIMITER_SERVICE_TOKEN_SECONDS:60}

  audit-pool:
    core-size: 1
    max-size: 5
    queue-capacity: 50
    thread-name-prefix: auth-audit-

spring:
  datasource:
    # Testcontainers auto-starts PostgreSQL via tc: JDBC URL (ContainerDatabaseDriver)
    url:      ${TEST_DB_URL:jdbc:tc:postgresql:16:///bio_test}
    username: ${TEST_DB_USER:bio_user}
    password: ${TEST_DB_PASS:bio_password}
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  flyway:
    enabled: false          # Migration stubs incomplete; Hibernate manages test schema
  jpa:
    hibernate:
      ddl-auto: create-drop  # Create schema from entities, drop on context close
  batch:
    job:
      enabled: false  # No batch jobs in test; UniProtImportJobConfig excluded via @Profile("!test")
    jdbc:
      initialize-schema: always

app:
  jwt:
    secret: test-secret-key-at-least-32-characters-long
    access-token-expiry-seconds: 3600
    refresh-token-expiry-seconds: 86400

logging:
  level:
    com.bioinformatics.dashboard: DEBUG

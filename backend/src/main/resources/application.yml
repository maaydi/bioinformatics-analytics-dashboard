# ── Application metadata ───────────────────────────────────────────────────────
application:
  title: BioInformatics Analytics Dashboard
  version: 1.0

# ── Spring configurations ──────────────────────────────────────────────────────
spring:
  application:
    name: bioinformatics-dashboard
  devtools:
    livereload:
      enabled: true

  # ── DataSource ──────────────────────────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bioinformatics_db}
    username: ${SPRING_DATASOURCE_USERNAME:bio_user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  # ── JPA / Hibernate ─────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema — JPA must not alter it
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        '[format_sql]': false
        '[default_batch_fetch_size]': 100  # Avoids N+1 on collections
        jdbc:
          batch_size: 1000
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  # ── Flyway ──────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ── Spring Batch ─────────────────────────────────────────────────────────────
  batch:
    job:
      enabled: false            # Jobs are triggered via API, not on startup
    jdbc:
      initialize-schema: always

  # ── File Upload ──────────────────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:2GB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:2GB}
  web:
    error:
      include-message: never

# ── Server ─────────────────────────────────────────────────────────────────────
server:
  port: 8080

# ── Application-specific properties ───────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:DEVELOPMENT_SECRET_REPLACE_IN_PROD}
    access-token-expiry-seconds: ${JWT_ACCESS_TOKEN_EXPIRY_SECONDS:3600}
    refresh-token-expiry-seconds: ${JWT_REFRESH_TOKEN_EXPIRY_SECONDS:86400}
  batch:
    chunk-size: ${BATCH_CHUNK_SIZE:250}
    skip-limit: ${BATCH_SKIP_LIMIT:1000}

  import-config:
    temp-dir: ${java.io.tmpdir}/bio-import
    extensions: dat,tsv
    pool:
      core-size: 2
      max-size: 10
      queue-capacity: 25
      thread-name-prefix: BatchAsync-
  export:
    csv:
      max-rows: 100000
  view-refresh:
    max-attempts: ${VIEW_REFRESH_MAX_ATTEMPTS:3}
    per-view-timeout-ms: ${VIEW_REFRESH_TIMEOUT_MS:45000}
    retry-backoff-ms: ${VIEW_REFRESH_RETRY_BACKOFF_MS:2000}
    sequence-sla-ms: ${VIEW_REFRESH_SEQUENCE_SLA_MS:180000}
  audit-pool:
    core-size: 1
    max-size: 10
    queue-capacity: 25
    thread-name-prefix: audit-


# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  config: classpath:logback-spring.xml
  file:
    name: bioinformatic.log
    path: ${LOG_PATH}

# ── Health ───────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    flyway:
      enable:


server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_REPO_URI:http://localhost:3000/bioinformatics/config-repo.git}
          clone-on-start: true
          default-label: main
          username: ${GITEA_USER:config-user}
          password: ${GITEA_PASSWORD:config-pass}
          skip-ssl-validation: true   # local dev only
        encrypt:
          enabled: true

encrypt:
  key: ${CONFIG_ENCRYPT_KEY:ChangeMeInProduction-32CharKey!!}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
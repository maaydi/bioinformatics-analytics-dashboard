server:
  port: ${SERVER_PORT:8888}

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: ${SPRING_CLOUD_CONFIG_SERVER_GIT_URI:http://localhost:3000/bioinformatics/config-repo.git}
          clone-on-start: true
          default-label: main
          username: ${SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME:config-user}
          password: ${SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD:config-pass}
          skip-ssl-validation: true   # local dev only
        encrypt:
          enabled: true

encrypt:
  key: ${ENCRYPT_KEY:ChangeMeInProduction-32CharKey!!}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

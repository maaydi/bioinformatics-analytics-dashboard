server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        enabled: false

encrypt:
  key: ${CONFIG_ENCRYPT_KEY:ChangeMeInProduction-32CharKey!!}

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
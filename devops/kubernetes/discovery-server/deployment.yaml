apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: bio-dashboard
  labels:
    app.kubernetes.io/name: discovery-server
    app.kubernetes.io/part-of: bio-dashboard
    app.kubernetes.io/component: service-discovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: discovery-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discovery-server
        app.kubernetes.io/part-of: bio-dashboard
        app.kubernetes.io/component: service-discovery
    spec:
      enableServiceLinks: false
      containers:
        - name: discovery-server
          image: bio-dashboard/discovery-server:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8761
          envFrom:
            - configMapRef:
                name: discovery-server-config
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: logs
          emptyDir: { }


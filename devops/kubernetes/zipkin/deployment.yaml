apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: bio-dashboard
  labels:
    app.kubernetes.io/name: zipkin
    app.kubernetes.io/part-of: bio-dashboard
    app.kubernetes.io/component: tracing
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zipkin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zipkin
        app.kubernetes.io/part-of: bio-dashboard
        app.kubernetes.io/component: tracing
    spec:
      enableServiceLinks: false
      containers:
        - name: zipkin
          image: openzipkin/zipkin:3.6.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9411
          envFrom:
            - configMapRef:
                name: zipkin-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi


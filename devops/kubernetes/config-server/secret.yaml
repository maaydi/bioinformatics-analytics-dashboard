# PLACEHOLDER VALUES ONLY (same as .env.example) — never commit real secrets.
# GIT_PASSWORD should be a Gitea access token with `repo` scope (see backend-config/README.md).
apiVersion: v1
kind: Secret
metadata:
  name: config-server-secret
  namespace: bio-dashboard
  labels:
    app.kubernetes.io/name: config-server
    app.kubernetes.io/part-of: bio-dashboard
    app.kubernetes.io/component: configuration
type: Opaque
stringData:
  SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME: "config-user"
  SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD: "change_me_in_production"
  ENCRYPT_KEY: "Change_Me_In_Production_32CharKey!!"


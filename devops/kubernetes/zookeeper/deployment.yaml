apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: bio-dashboard
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/part-of: bio-dashboard
    app.kubernetes.io/component: coordination
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zookeeper
        app.kubernetes.io/part-of: bio-dashboard
        app.kubernetes.io/component: coordination
    spec:
      # Mandatory for Confluent images: service links would inject ZOOKEEPER_PORT=tcp://… and break the config.
      enableServiceLinks: false
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.8.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: client
              containerPort: 2181
          envFrom:
            - configMapRef:
                name: zookeeper-config
          readinessProbe:
            exec:
              command: [ "sh", "-c", "echo ruok | nc localhost 2181 | grep -q imok" ]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi


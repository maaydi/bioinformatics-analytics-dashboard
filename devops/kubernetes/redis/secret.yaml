# PLACEHOLDER VALUES ONLY (same as .env.example) — never commit real secrets.
# Single source of truth for the Redis password (consumed by every Spring service via secretKeyRef).
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: bio-dashboard
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: bio-dashboard
    app.kubernetes.io/component: cache
type: Opaque
stringData:
  REDIS_PASSWORD: "change_me_in_production"


apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-server-config
  namespace: bio-dashboard
  labels:
    app.kubernetes.io/name: gitea-server
    app.kubernetes.io/part-of: bio-dashboard
    app.kubernetes.io/component: config-repository
data:
  USER_UID: "1000"
  USER_GID: "1000"
  GITEA__database__DB_TYPE: "postgres"
  GITEA__database__HOST: "gitea-db:5432"
  GITEA__database__NAME: "gitea"
  # Reached from the host with: kubectl -n bio-dashboard port-forward svc/gitea-server 3000:3000
  GITEA__server__ROOT_URL: "http://localhost:3000/"
  GITEA__server__HTTP_PORT: "3000"
  GITEA__server__SSH_PORT: "22"
  GITEA__service__DISABLE_REGISTRATION: "false"


apiVersion: v1
kind: Service
metadata:
  name: gitea-server
  namespace: bio-dashboard
  labels:
    app.kubernetes.io/name: gitea-server
    app.kubernetes.io/part-of: bio-dashboard
    app.kubernetes.io/component: config-repository
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gitea-server
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30300
    - name: ssh
      port: 22
      targetPort: ssh
      nodePort: 30222


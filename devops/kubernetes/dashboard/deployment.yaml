# docker-compose service `backend` — renamed `dashboard` to match spring.application.name / Eureka (lb://dashboard).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: bio-dashboard
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: bio-dashboard
    app.kubernetes.io/component: business-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
        app.kubernetes.io/part-of: bio-dashboard
        app.kubernetes.io/component: business-service
    spec:
      enableServiceLinks: false
      containers:
        - name: dashboard
          image: bio-dashboard/dashboard:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - configMapRef:
                name: bio-common-config
            - secretRef:
                name: bio-common-secret
            - configMapRef:
                name: dashboard-config
            - secretRef:
                name: dashboard-secret
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 36 # Flyway migrations + materialized views may slow the first start
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: logs
          emptyDir: { }


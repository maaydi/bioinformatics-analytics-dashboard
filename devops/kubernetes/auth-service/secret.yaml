# PLACEHOLDER VALUES ONLY (same as .env.example) — never commit real secrets.
# Service-owned DB credentials (prepares ARCH-002: one DB user per service).
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: bio-dashboard
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: bio-dashboard
    app.kubernetes.io/component: business-service
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "bio_user"
  SPRING_DATASOURCE_PASSWORD: "change_me_in_production"
  COMMON_DATASOURCE_PRIMARY_USERNAME: "bio_user"
  COMMON_DATASOURCE_PRIMARY_PASSWORD: "change_me_in_production"
  COMMON_DATASOURCE_REPLICA_USERNAME: "bio_user"
  COMMON_DATASOURCE_REPLICA_PASSWORD: "change_me_in_production"


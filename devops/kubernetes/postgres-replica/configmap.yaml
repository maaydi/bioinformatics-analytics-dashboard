apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-replica-config
  namespace: bio-dashboard
  labels:
    app.kubernetes.io/name: postgres-replica
    app.kubernetes.io/part-of: bio-dashboard
    app.kubernetes.io/component: database
data:
  POSTGRES_DB: "bioinformatics_db"
  PGDATA: "/var/lib/postgresql/data/pgdata"
  PRIMARY_HOST: "postgres"
  PRIMARY_PORT: "5432"
  # Streaming-replica bootstrap (port of the docker-compose `postgres-replica` command).
  start-replica.sh: |
    #!/bin/sh
    set -eu

    until pg_isready -h "${PRIMARY_HOST}" -p "${PRIMARY_PORT}" -U "${POSTGRES_USER}" -d "${POSTGRES_DB}"; do
      echo "Waiting for primary ${PRIMARY_HOST}:${PRIMARY_PORT}..."
      sleep 2
    done

    mkdir -p "${PGDATA}"

    if [ ! -s "${PGDATA}/PG_VERSION" ]; then
      echo "Initializing replica from primary..."
      rm -rf "${PGDATA:?}"/*
      chown postgres:postgres "${PGDATA}"
      chmod 0700 "${PGDATA}"

      if ! su-exec postgres pg_basebackup -h "${PRIMARY_HOST}" -p "${PRIMARY_PORT}" -D "${PGDATA}" \
            -U "${POSTGRES_USER}" -vP -R -X stream; then
        echo "pg_basebackup failed! Exiting..."
        exit 1
      fi
    fi

    echo "Securing data directory permissions..."
    chown -R postgres:postgres "${PGDATA}"
    chmod 0700 "${PGDATA}"

    echo "Starting replica..."
    exec su-exec postgres postgres -D "${PGDATA}"


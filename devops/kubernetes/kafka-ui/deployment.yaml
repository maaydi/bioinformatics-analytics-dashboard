apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: bio-dashboard
  labels:
    app.kubernetes.io/name: kafka-ui
    app.kubernetes.io/part-of: bio-dashboard
    app.kubernetes.io/component: messaging-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-ui
        app.kubernetes.io/part-of: bio-dashboard
        app.kubernetes.io/component: messaging-ui
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka-ui
          # Pinned tag instead of `latest` (latest forces imagePullPolicy=Always and is not reproducible).
          image: provectuslabs/kafka-ui:v0.7.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: kafka-ui-config
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi


# PLACEHOLDER VALUES ONLY (same as .env.example) — never commit real secrets.
# Single source of truth for the primary superuser, also consumed by postgres-replica.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: bio-dashboard
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: bio-dashboard
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_USER: "bio_user"
  POSTGRES_PASSWORD: "change_me_in_production"


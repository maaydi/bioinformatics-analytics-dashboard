apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: bio-dashboard
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: bio-dashboard
    app.kubernetes.io/component: messaging
spec:
  type: ClusterIP
  # The broker/controller connects to its advertised Service during startup.
  # Withholding unready endpoints would prevent it from ever becoming ready.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: internal
      port: 29092
      targetPort: internal
    - name: host
      port: 9092
      targetPort: host


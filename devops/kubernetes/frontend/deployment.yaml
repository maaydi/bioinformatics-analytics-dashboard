# Build the Angular production bundle before building this runtime-only image.
# Deploy after api-gateway: nginx resolves its upstream when it starts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bio-dashboard
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: bio-dashboard
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: bio-dashboard
        app.kubernetes.io/component: frontend
    spec:
      enableServiceLinks: false
      containers:
        - name: frontend
          image: bio-dashboard/frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

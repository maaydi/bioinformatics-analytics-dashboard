# Shared sensitive Spring configuration.
# PLACEHOLDER VALUES ONLY (same as .env.example) — never commit real secrets.
# Override locally, e.g.:
#   kubectl -n bio-dashboard create secret generic bio-common-secret \
#     --from-literal=APP_JWT_SECRET="$(openssl rand -base64 48)" --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: bio-common-secret
  namespace: bio-dashboard
  labels:
    app.kubernetes.io/part-of: bio-dashboard
    app.kubernetes.io/component: shared-config
type: Opaque
stringData:
  APP_JWT_SECRET: "REPLACE_WITH_A_STRONG_RANDOM_SECRET_AT_LEAST_32_CHARS"


# Sensitive values come from shared secrets:
#   - APP_JWT_SECRET            → bio-common-secret
#   - REDIS password            → redis-secret (single source of truth)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: bio-dashboard
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: bio-dashboard
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: bio-dashboard
        app.kubernetes.io/component: gateway
    spec:
      enableServiceLinks: false
      containers:
        - name: api-gateway
          image: bio-dashboard/api-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: bio-common-config
            - secretRef:
                name: bio-common-secret
            - configMapRef:
                name: api-gateway-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: logs
          emptyDir: { }


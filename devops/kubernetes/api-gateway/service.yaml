apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: bio-dashboard
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: bio-dashboard
    app.kubernetes.io/component: gateway
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080


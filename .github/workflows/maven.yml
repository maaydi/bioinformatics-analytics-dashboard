name: Java Angular CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Tests - Spring Boot
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend
    env:
      TESTCONTAINERS_RYUK_DISABLED: true
      DOCKER_HOST: unix:///var/run/docker.sock
      
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bio_test
          POSTGRES_USER: bio_user
          POSTGRES_PASSWORD: bio_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U bio_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Verify Docker
        run: docker version
      - name: Test with Maven
        run: mvn -B test --file pom.xml
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
  frontend-test:
    name: Frontend Tests - Angular
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Angular tests
        run: npm test -- --browsers=ChromeHeadless
        

# ─────────────────────────────────────────────────────────────────────────────
# Analytics Service — business configuration (all profiles)
# ─────────────────────────────────────────────────────────────────────────────

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: analytics
        '[format_sql]': false
        '[default_batch_fetch_size]': 25
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: analytics
    default-schema: analytics
    create-schemas: true
    baseline-on-migrate: false
    validate-on-migrate: true

common:
  enabled: true

app:
  rate-limiter:
    enabled: true
    global:
      name: global
      capacity: 200
      tokens: 200
      seconds: 60

  audit-pool:
    core-size: 1
    max-size: 5
    queue-capacity: 50
    thread-name-prefix: analytics-audit-

# ─────────────────────────────────────────────────────────────────────────────
# Import Service — business configuration (all profiles)
# ─────────────────────────────────────────────────────────────────────────────

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: import_batch
        '[format_sql]': false
        '[default_batch_fetch_size]': 25
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
    open-in-view: false
  batch:
    job:
      enabled: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: import_batch
    default-schema: import_batch
    create-schemas: true
    baseline-on-migrate: false
    validate-on-migrate: true

  kafka:
    bootstrap-servers: kafka:9092

common:
  enabled: true
  cache:
    enabled: true
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 5
    consumer:
      group-id: import-service
      concurrency: 1
      auto-offset-reset: earliest
      batch-listener: false

app:
  rate-limiter:
    enabled: true
    global:
      name: global
      capacity: 200
      tokens: 200
      seconds: 60

  audit-pool:
    core-size: 1
    max-size: 5
    queue-capacity: 50
    thread-name-prefix: import-audit-

  import-config:
    temp-dir: ${APP_IMPORT_CONFIG_TEMP_DIR:${user.home}/.bio-import}
    extensions: dat,tsv
    pool:
      core-size: 2
      max-size: 10
      queue-capacity: 25
      thread-name-prefix: BatchAsync-
  batch:
    chunk-size: ${APP_BATCH_CHUNK_SIZE:250}
    skip-limit: ${APP_BATCH_SKIP_LIMIT:1000}

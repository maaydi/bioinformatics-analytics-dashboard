# ─────────────────────────────────────────────────────────────────────────────
# Dashboard Service — business configuration (all profiles)
# ─────────────────────────────────────────────────────────────────────────────

app:
  export:
    csv:
      max-rows: 100000

  audit-pool:
    core-size: 1
    max-size: 10
    queue-capacity: 25
    thread-name-prefix: audit-

  rate-limiter:
    endpoints:
      - name: search
        capacity: ${APP_RATE_LIMITER_SEARCH_CAPACITY:30}
        tokens: ${APP_RATE_LIMITER_SEARCH_TOKENS:30}
        seconds: ${APP_RATE_LIMITER_SEARCH_SECONDS:60}
      - name: detail
        capacity: ${APP_RATE_LIMITER_DETAIL_CAPACITY:60}
        tokens: ${APP_RATE_LIMITER_DETAIL_TOKENS:60}
        seconds: ${APP_RATE_LIMITER_DETAIL_SECONDS:60}
      - name: autocomplete
        capacity: ${APP_RATE_LIMITER_AUTOCOMPLETE_CAPACITY:120}
        tokens: ${APP_RATE_LIMITER_AUTOCOMPLETE_TOKENS:120}
        seconds: ${APP_RATE_LIMITER_AUTOCOMPLETE_SECONDS:60}
      - name: export
        capacity: ${APP_RATE_LIMITER_EXPORT_CAPACITY:10}
        tokens: ${APP_RATE_LIMITER_EXPORT_TOKENS:10}
        seconds: ${APP_RATE_LIMITER_EXPORT_SECONDS:60}

common:
  enabled: true
  cache:
    enabled: true
  kafka:
    bootstrap-servers: ${COMMON_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

# ── App-specific business config ─────────────────────────────────────────────
app:
  batch:
    chunk-size: 250
    skip-limit: 1000
  uniprot-api:
    base-url: https://rest.uniprot.org
    batch:
      chunk-size: 100
      skip-limit: 1000
  import-config:
    temp-dir: ${APP_DIR}/.bio-import
    extensions: dat,tsv
    pool:
      core-size: 2
      max-size: 10
      queue-capacity: 25
      thread-name-prefix: BatchAsync-
  export:
    csv:
      max-rows: 100000
  view-refresh:
    max-attempts: 3
    per-view-timeout-ms: 45000
    retry-backoff-ms: 2000
    sequence-sla-ms: 180000
  audit-pool:
    core-size: 1
    max-size: 10
    queue-capacity: 25
    thread-name-prefix: audit-
  rate-limiter:
    enabled: true
    global:
      name: global
      capacity: 100
      tokens: 100
      seconds: 60
    endpoints:
      - name: import
        capacity: 5
        tokens: 5
        seconds: 60
      - name: search
        capacity: 30
        tokens: 30
        seconds: 60
      - name: detail
        capacity: 60
        tokens: 60
        seconds: 60
      - name: analysis
        capacity: 20
        tokens: 20
        seconds: 60
      - name: export
        capacity: 10
        tokens: 10
        seconds: 60
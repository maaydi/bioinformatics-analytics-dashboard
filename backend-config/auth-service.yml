# ─────────────────────────────────────────────────────────────────────────────
# Auth Service — business configuration (all profiles)
# ─────────────────────────────────────────────────────────────────────────────

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: auth
        '[format_sql]': false
        '[default_batch_fetch_size]': 25
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: auth
    default-schema: auth
    create-schemas: true
    baseline-on-migrate: false
    validate-on-migrate: true

common:
  enabled: true
  kafka:
    bootstrap-servers: ${COMMON_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

app:
  token:
    refresh-rotation-enabled: true
    max-active-sessions-per-user: 5

  password:
    min-length: 8
    require-uppercase: true
    require-digit: true
    require-special-char: false
    bcrypt-strength: 12

  rate-limiter:
    endpoints:
      - name: login
        capacity: ${APP_RATE_LIMITER_LOGIN_CAPACITY:10}
        tokens: ${APP_RATE_LIMITER_LOGIN_TOKENS:10}
        seconds: ${APP_RATE_LIMITER_LOGIN_SECONDS:60}
      - name: refresh
        capacity: ${APP_RATE_LIMITER_REFRESH_CAPACITY:20}
        tokens: ${APP_RATE_LIMITER_REFRESH_TOKENS:20}
        seconds: ${APP_RATE_LIMITER_REFRESH_SECONDS:60}
      - name: logout
        capacity: ${APP_RATE_LIMITER_LOGOUT_CAPACITY:30}
        tokens: ${APP_RATE_LIMITER_LOGOUT_TOKENS:30}
        seconds: ${APP_RATE_LIMITER_LOGOUT_SECONDS:60}
      - name: change-password
        capacity: ${APP_RATE_LIMITER_CHANGE_PASSWORD_CAPACITY:5}
        tokens: ${APP_RATE_LIMITER_CHANGE_PASSWORD_TOKENS:5}
        seconds: ${APP_RATE_LIMITER_CHANGE_PASSWORD_SECONDS:60}
      - name: service-token
        capacity: ${APP_RATE_LIMITER_SERVICE_TOKEN_CAPACITY:5}
        tokens: ${APP_RATE_LIMITER_SERVICE_TOKEN_TOKENS:5}
        seconds: ${APP_RATE_LIMITER_SERVICE_TOKEN_SECONDS:60}

  audit-pool:
    core-size: 1
    max-size: 5
    queue-capacity: 50
    thread-name-prefix: auth-audit-

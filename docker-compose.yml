# ── Shared Spring Service Environment ─────────────────────────────────────
x-common-spring-env: &common-spring-env
  SPRING_PROFILES_ACTIVE: prod
  SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
  EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE}
  EUREKA_CLIENT_SHOULD_UNREGISTER_ON_SHUTDOWN: "true"
  SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST}
  SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT}
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}


services:
  # ==========================================================================
  #  INFRASTRUCTURE: Discovery Server
  # ==========================================================================
  discovery-server:
    build:
      context: ./backend/infrastructure/discovery-server
      dockerfile: ../../../devops/docker/backend/infra/server-discovery/Dockerfile
    container_name: discovery_server
    env_file: .env
    environment:
      SERVER_PORT: ${SERVER_PORT_DISCOVERY_SERVER:-8761}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      EUREKA_INSTANCE_HOSTNAME: discovery-server
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
    ports:
      - "${SERVER_PORT_DISCOVERY_SERVER:-8761}:8761"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================================================
  #  INFRASTRUCTURE: Gitea + Dedicated Postgres
  # ==========================================================================
  gitea-db:
    image: postgres:16-alpine
    container_name: gitea_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${GITEA_DB_NAME}
      POSTGRES_USER: ${GITEA_DB_USER}
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD}
    volumes:
      - gitea_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -q" ]
      interval: 10s
      timeout: 5s
      retries: 5

  gitea-server:
    image: gitea/gitea:latest
    container_name: gitea-server
    env_file: .env
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: ${GITEA_DB_NAME}
      GITEA__database__USER: ${GITEA_DB_USER}
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD}
      GITEA__server__ROOT_URL: http://localhost:3000
      GITEA__server__HTTP_PORT: 3000
      GITEA__service__DISABLE_REGISTRATION: "false"
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${GITEA_HTTP_PORT:-3000}:3000"
      - "${GITEA_SSH_PORT:-222}:22"
    depends_on:
      gitea-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================================================
  #  INFRASTRUCTURE: Config Server
  # ==========================================================================
  config-server:
    build:
      context: ./backend/infrastructure/config-server
      dockerfile: ../../../devops/docker/backend/infra/config-server/Dockerfile
    container_name: config_server
    env_file: .env
    environment:
      SERVER_PORT: ${SERVER_PORT_CONFIG_SERVER:-8888}
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: ${SPRING_CLOUD_CONFIG_SERVER_GIT_URI}
      SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME: ${SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME}
      SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD: ${SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD}
      ENCRYPT_KEY: ${ENCRYPT_KEY}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE}
      EUREKA_CLIENT_SHOULD_UNREGISTER_ON_SHUTDOWN: "true"
      SPRING_APPLICATION_NAME: config-server
    ports:
      - "${SERVER_PORT_CONFIG_SERVER:-8888}:8888"
    depends_on:
      gitea-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================================================
  #  INFRASTRUCTURE: API Gateway
  # ==========================================================================
  api-gateway:
    build:
      context: ./backend/infrastructure/api-gateway
      dockerfile: ../../../devops/docker/backend/infra/api-gateway/Dockerfile
    container_name: api_gateway
    env_file: .env
    environment:
      <<: *common-spring-env
      SERVER_PORT: ${SERVER_PORT_API_GATEWAY:-8080}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE}
      EUREKA_CLIENT_SHOULD_UNREGISTER_ON_SHUTDOWN: "true"
      SPRING_APPLICATION_NAME: api-gateway
    ports:
      - "${SERVER_PORT_API_GATEWAY:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================================================
  #  DATA_STORES
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: bio_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.8-alpine
    container_name: local-redis
    restart: always
    env_file: .env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${SPRING_DATA_REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==========================================================================
  #  APPLICATION SERVICES
  # ==========================================================================

  auth-service:
    build:
      context: ./backend/services/auth-service
      dockerfile: ../../../devops/docker/backend/services/auth-service/Dockerfile
    container_name: auth_service
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common-spring-env
      SERVER_PORT: ${SERVER_PORT_AUTH_SERVICE:-8081}
      SPRING_APPLICATION_NAME: auth-service
      COMMON_DATASOURCE_PRIMARY_URL: ${COMMON_DATASOURCE_PRIMARY_URL}
      COMMON_DATASOURCE_PRIMARY_USERNAME: ${COMMON_DATASOURCE_PRIMARY_USERNAME}
      COMMON_DATASOURCE_PRIMARY_PASSWORD: ${COMMON_DATASOURCE_PRIMARY_PASSWORD}
      COMMON_DATASOURCE_REPLICA_URL: ${COMMON_DATASOURCE_REPLICA_URL}
      COMMON_DATASOURCE_REPLICA_USERNAME: ${COMMON_DATASOURCE_REPLICA_USERNAME}
      COMMON_DATASOURCE_REPLICA_PASSWORD: ${COMMON_DATASOURCE_REPLICA_PASSWORD}
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  analytics-service:
    build:
      context: ./backend/services/analytics-service
      dockerfile: ../../../devops/docker/backend/services/analytics-service/Dockerfile
    container_name: analytics_service
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common-spring-env
      SERVER_PORT: ${SERVER_PORT_ANALYTICS_SERVICE:-8082}
      SPRING_APPLICATION_NAME: analytics-service
      COMMON_DATASOURCE_REPLICA_URL: ${COMMON_DATASOURCE_REPLICA_URL}
      COMMON_DATASOURCE_REPLICA_USERNAME: ${COMMON_DATASOURCE_REPLICA_USERNAME}
      COMMON_DATASOURCE_REPLICA_PASSWORD: ${COMMON_DATASOURCE_REPLICA_PASSWORD}
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  import-service:
    build:
      context: ./backend/services/import-service
      dockerfile: ../../../devops/docker/backend/services/import-service/Dockerfile
    container_name: import_service
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common-spring-env
      SERVER_PORT: ${SERVER_PORT_IMPORT_SERVICE:-8083}
      SPRING_APPLICATION_NAME: import-service
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  backend:
    build:
      context: ./backend/dashboard
      dockerfile: ../../devops/docker/backend/Dockerfile
    container_name: bio_backend
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common-spring-env
      SERVER_PORT: ${SERVER_PORT_BACKEND:-8084}
      SPRING_APPLICATION_NAME: dashboard
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:-2GB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:-2GB}
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    volumes:
      - import_uploads:/tmp/import
      - backend_logs:/app/logs
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: ./devops/docker/frontend/Dockerfile
    container_name: bio_frontend
    restart: unless-stopped
    environment:
      ANGULAR_API_BASE_URL: ${ANGULAR_API_BASE_URL}
    ports:
      - "${SERVER_PORT_FRONTEND:-80}:80"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  postgres_data:
  import_uploads:
  redis_data:
  backend_logs:
  gitea_db_data:
  gitea_data:

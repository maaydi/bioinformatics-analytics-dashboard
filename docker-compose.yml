# ── Shared Spring Service Environment ─────────────────────────────────────
x-common-spring-env: &common-spring-env
  SPRING_PROFILES_ACTIVE: prod
  SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
  EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE}
  EUREKA_CLIENT_SHOULD_UNREGISTER_ON_SHUTDOWN: "true"
  SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST}
  SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT}
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  SPRING_CLOUD_ZOOKEEPER_CONNECT_STRING: zookeeper:2181
  SPRING_CLOUD_ZOOKEEPER_DISCOVERY_ENABLED: "true"
  SPRING_CLOUD_ZOOKEEPER_DISCOVERY_ROOT: /services
  SPRING_CLOUD_ZOOKEEPER_DISCOVERY_REGISTER: "true"
  # Zipkin tracing configuration
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
  COMMON_TRACING_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans

services:
  # ==========================================================================
  #  DATA_STORES
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: bio_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      (
        until pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} >/dev/null 2>&1; do sleep 1; done
        if ! grep -q \"host replication ${POSTGRES_USER}\" /var/lib/postgresql/data/pg_hba.conf; then
          echo 'Patching pg_hba.conf to allow replication...'
          echo \"host replication ${POSTGRES_USER} all scram-sha-256\" >> /var/lib/postgresql/data/pg_hba.conf
          PGPASSWORD=\"${POSTGRES_PASSWORD}\" psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c \"SELECT pg_reload_conf();\"
        fi
      ) &

      exec /usr/local/bin/docker-entrypoint.sh postgres \
        -c wal_level=replica \
        -c max_wal_senders=10 \
        -c max_replication_slots=10
      "
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: postgres:16-alpine
    container_name: bio_postgres_replica
    restart: unless-stopped
    env_file: .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_REPLICA_PORT:-5433}:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      until pg_isready -h bio_postgres -p 5432 -U ${POSTGRES_USER} -d ${POSTGRES_DB}; do
        echo 'Waiting for primary database network...'
        sleep 2
      done

      if [ ! -s /var/lib/postgresql/data/postgresql.conf ]; then
        echo 'Initializing replica from primary...'

        rm -rf /var/lib/postgresql/data/*
        chown postgres:postgres /var/lib/postgresql/data

        if ! su-exec postgres pg_basebackup -h bio_postgres -D /var/lib/postgresql/data -U ${POSTGRES_USER} -vP -R -X stream; then
          echo 'pg_basebackup failed! Exiting...'
          exit 1
        fi
      fi

      echo 'Securing data directory permissions...'
      chown -R postgres:postgres /var/lib/postgresql/data
      chmod 0700 /var/lib/postgresql/data

      echo 'Starting replica...'
      exec su-exec postgres postgres
      "
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8.8-alpine
    container_name: local-redis
    restart: always
    env_file: .env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${SPRING_DATA_REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
  # ==========================================================================
  #  INFRASTRUCTURE: Zipkin
  # ==========================================================================
  zipkin:
    image: openzipkin/zipkin:3.6.1
    container_name: zipkin
    restart: unless-stopped
    ports:
      - "${ZIPKIN_PORT:-9411}:9411"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9411/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  # ==========================================================================
  #  INFRASTRUCTURE: Zookeeper
  # ==========================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.8.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok"
    healthcheck:
      test: [ "CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok" ]
      interval: 10s
      timeout: 5s
      retries: 5
  # ==========================================================================
  #  INFRASTRUCTURE: Kafka
  # ==========================================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  # Init container to handle exact topic partition requirements
  kafka-init-topics:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka_init_topics
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "Creating Kafka topics..."
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic protein.events.imported --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic export.events.completed --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic auth.events.authenticated --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic audit.events.log --partitions 6 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic nlq.events.executed --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic structure.events.viewed --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic notification.events.trigger --partitions 3 --replication-factor 1
        echo "Topics created successfully."

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      kafka:
        condition: service_healthy

  # ==========================================================================
  #  INFRASTRUCTURE: Discovery Server
  # ==========================================================================
  discovery-server:
    build:
      context: ./backend/infrastructure/discovery-server
      dockerfile: ../../../devops/docker/backend/infra/server-discovery/Dockerfile
    container_name: discovery_server
    env_file: .env
    environment:
      SERVER_PORT: ${SERVER_PORT_DISCOVERY_SERVER:-8761}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      EUREKA_INSTANCE_HOSTNAME: discovery-server
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
    ports:
      - "${SERVER_PORT_DISCOVERY_SERVER:-8761}:8761"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================================================
  #  INFRASTRUCTURE: Gitea + Dedicated Postgres
  # ==========================================================================
  gitea-db:
    image: postgres:16-alpine
    container_name: gitea_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${GITEA_DB_NAME}
      POSTGRES_USER: ${GITEA_DB_USER}
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD}
    volumes:
      - gitea_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -q" ]
      interval: 10s
      timeout: 5s
      retries: 5

  gitea-server:
    image: gitea/gitea:latest
    container_name: gitea-server
    env_file: .env
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: ${GITEA_DB_NAME}
      GITEA__database__USER: ${GITEA_DB_USER}
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD}
      GITEA__server__ROOT_URL: http://localhost:3000
      GITEA__server__HTTP_PORT: 3000
      GITEA__service__DISABLE_REGISTRATION: "false"
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${GITEA_HTTP_PORT:-3000}:3000"
      - "${GITEA_SSH_PORT:-222}:22"
    depends_on:
      gitea-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================================================
  #  INFRASTRUCTURE: Config Server
  # ==========================================================================
  config-server:
    build:
      context: ./backend/infrastructure/config-server
      dockerfile: ../../../devops/docker/backend/infra/config-server/Dockerfile
    container_name: config_server
    env_file: .env
    environment:
      SERVER_PORT: ${SERVER_PORT_CONFIG_SERVER:-8888}
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: ${SPRING_CLOUD_CONFIG_SERVER_GIT_URI}
      SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME: ${SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME}
      SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD: ${SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD}
      ENCRYPT_KEY: ${ENCRYPT_KEY}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE}
      EUREKA_CLIENT_SHOULD_UNREGISTER_ON_SHUTDOWN: "true"
      SPRING_APPLICATION_NAME: config-server
    ports:
      - "${SERVER_PORT_CONFIG_SERVER:-8888}:8888"
    depends_on:
      gitea-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================================================
  #  INFRASTRUCTURE: API Gateway
  # ==========================================================================
  api-gateway:
    build:
      context: ./backend/infrastructure/api-gateway
      dockerfile: ../../../devops/docker/backend/infra/api-gateway/Dockerfile
    container_name: api_gateway
    env_file: .env
    environment:
      <<: *common-spring-env
      SERVER_PORT: ${SERVER_PORT_API_GATEWAY:-8080}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE}
      EUREKA_CLIENT_SHOULD_UNREGISTER_ON_SHUTDOWN: "true"
      SPRING_APPLICATION_NAME: api-gateway
    ports:
      - "${SERVER_PORT_API_GATEWAY:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================================================
  #  APPLICATION SERVICES
  # ==========================================================================

  auth-service:
    build:
      context: ./backend/services/auth-service
      dockerfile: ../../../devops/docker/backend/services/auth-service/Dockerfile
    container_name: auth_service
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common-spring-env
      SERVER_PORT: ${SERVER_PORT_AUTH_SERVICE:-8081}
      SPRING_APPLICATION_NAME: auth-service
      COMMON_DATASOURCE_PRIMARY_URL: ${COMMON_DATASOURCE_PRIMARY_URL}
      COMMON_DATASOURCE_PRIMARY_USERNAME: ${COMMON_DATASOURCE_PRIMARY_USERNAME}
      COMMON_DATASOURCE_PRIMARY_PASSWORD: ${COMMON_DATASOURCE_PRIMARY_PASSWORD}
      COMMON_DATASOURCE_REPLICA_URL: ${COMMON_DATASOURCE_REPLICA_URL}
      COMMON_DATASOURCE_REPLICA_USERNAME: ${COMMON_DATASOURCE_REPLICA_USERNAME}
      COMMON_DATASOURCE_REPLICA_PASSWORD: ${COMMON_DATASOURCE_REPLICA_PASSWORD}
    depends_on:
      config-server:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  analytics-service:
    build:
      context: ./backend/services/analytics-service
      dockerfile: ../../../devops/docker/backend/services/analytics-service/Dockerfile
    container_name: analytics_service
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common-spring-env
      SERVER_PORT: ${SERVER_PORT_ANALYTICS_SERVICE:-8082}
      SPRING_APPLICATION_NAME: analytics-service
      COMMON_DATASOURCE_REPLICA_URL: ${COMMON_DATASOURCE_REPLICA_URL}
      COMMON_DATASOURCE_REPLICA_USERNAME: ${COMMON_DATASOURCE_REPLICA_USERNAME}
      COMMON_DATASOURCE_REPLICA_PASSWORD: ${COMMON_DATASOURCE_REPLICA_PASSWORD}
      COMMON_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      COMMON_KAFKA_CONSUMER_ACK_MODE: manual
    depends_on:
      config-server:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  backend:
    build:
      context: ./backend/dashboard
      dockerfile: ../../devops/docker/backend/Dockerfile
    container_name: bio_backend
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common-spring-env
      SERVER_PORT: ${SERVER_PORT_BACKEND:-8084}
      SPRING_APPLICATION_NAME: dashboard
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:-2GB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:-2GB}
    depends_on:
      config-server:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    volumes:
      - import_uploads:/tmp/import
      - backend_logs:/app/logs
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  import-service:
    build:
      context: ./backend/services/import-service
      dockerfile: ../../../devops/docker/backend/services/import-service/Dockerfile
    container_name: import_service
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common-spring-env
      SERVER_PORT: ${SERVER_PORT_IMPORT_SERVICE:-8083}
      SPRING_APPLICATION_NAME: import-service
      SPRING_BATCH_JOB_ENABLED: false
      SPRING_BATCH_JOB_NAME: NONE
      COMMON_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      config-server:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: ./devops/docker/frontend/Dockerfile
    container_name: bio_frontend
    restart: unless-stopped
    environment:
      ANGULAR_API_BASE_URL: ${ANGULAR_API_BASE_URL}
    ports:
      - "${SERVER_PORT_FRONTEND:-80}:80"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  postgres_data:
  postgres_replica_data:
  import_uploads:
  redis_data:
  backend_logs:
  gitea_db_data:
  gitea_data:

services:
  # ===========================================================================
  #  INFRASTRUCTURE: Discovery
  # ===========================================================================
  discovery-server:
    build:
      context: ./backend/infrastructure/discovery-server
      dockerfile: ../../../devops/docker/backend/infra/server-discovery/Dockerfile
    container_name: discovery_server
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
      EUREKA_INSTANCE_HOSTNAME: discovery-server
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health" ] # SERVER_PORT=8761
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================================================
  #  INFRASTRUCTURE: Gitea + Dedicated Postgres
  # ===========================================================================
  gitea-db:
    image: postgres:16-alpine
    container_name: gitea_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${GITEA_DB_NAME}
      POSTGRES_USER: ${GITEA_DB_USER}
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD}
    volumes:
      - gitea_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -q" ]
      interval: 10s
      timeout: 5s
      retries: 5
  gitea-server:
    image: gitea/gitea:latest
    container_name: gitea-server
    env_file: .env
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: ${GITEA_DB_NAME}
      GITEA__database__USER: ${GITEA_DB_USER}
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD:-gitea_secure_password}
      GITEA__server__ROOT_URL: http://localhost:3000
      GITEA__server__HTTP_PORT: 3000
      GITEA__service__DISABLE_REGISTRATION: false
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${GITEA_HTTP_PORT:-3000}:3000"
      - "${GITEA_SSH_PORT:-222}:22"
    depends_on:
      gitea-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================================================
  #  INFRASTRUCTURE: Config Server
  # ===========================================================================
  config-server:
    build:
      context: ./backend/infrastructure/config-server
      dockerfile: ../../../devops/docker/backend/infra/config-server/Dockerfile
    container_name: config_server
    environment:
      SERVER_PORT: 8888
      CONFIG_REPO_URI: http://gitea-server:3000/bioinformatics/config-repo.git
      GITEA_USER: ${GITEA_CONFIG_USER:-config-user}
      GITEA_PASSWORD: ${GITEA_CONFIG_PASSWORD:-config-pass}
      CONFIG_ENCRYPT_KEY: ${CONFIG_ENCRYPT_KEY:-ChangeMeInProduction-32CharKey!!}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: config-server
    ports:
      - "${CONFIG_SERVER_PORT:-8888}:8888"
    depends_on:
      gitea-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  # ===========================================================================
  #  Application
  # ===========================================================================

  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bio_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ── Redis 8 Alpine ───────────────────────────────────────────────────────────
  redis:
    image: redis:8.8-alpine
    container_name: local-redis
    restart: always
    env_file: .env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: ${REDIS_PORT}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Server Discovery Eureka ────────────────────────────────────────────────

  # ── Spring Boot Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend/dashboard
      dockerfile: ../../devops/docker/backend/Dockerfile
    container_name: bio_backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Server configuration
      SERVER_PORT: ${BACKEND_PORT:-8080}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      # Database configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bioinformatics_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      # JWT configuration
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRY_SECONDS: ${JWT_ACCESS_TOKEN_EXPIRY_SECONDS:-3600}
      JWT_REFRESH_TOKEN_EXPIRY_SECONDS: ${JWT_REFRESH_TOKEN_EXPIRY_SECONDS:-86400}
      # File upload configuration
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:-2GB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:-2GB}
      # Redis configuration
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Server discovery
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    volumes:
      - import_uploads:/tmp/import
      - backend_logs:/app/logs
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ] # BACKEND_PORT=8080
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Angular Frontend (served by nginx) ─────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: ./devops/docker/frontend/Dockerfile
    container_name: bio_frontend
    restart: unless-stopped
    environment:
      ANGULAR_API_BASE_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy


volumes:
  postgres_data:
  import_uploads:
  redis_data:
  backend_logs:
  gitea_db_data:
  gitea_data:

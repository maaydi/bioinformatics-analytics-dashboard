<mat-toolbar aria-label="Primary navigation" class="mat-toolbar" role="navigation">
  <img alt="Bioinformatics Analytics Dashboard logo" class="app-logo" src="/bio_logo.png">
  <span class="app-title">BioInfo Dashboard</span>
  <span class="spacer"></span>

  <div aria-label="Main sections" class="nav-links">
    <a
      [routerLinkActiveOptions]="{ exact: true }"
      mat-button
      routerLink="/"
      routerLinkActive="active"
    >
      Dashboard
    </a>
    <a mat-button routerLink="/genes" routerLinkActive="active">Gene Explorer</a>
    <a mat-button routerLink="/analytics" routerLinkActive="active">Analytics</a>
    <a mat-button routerLink="/saved-filters" routerLinkActive="active">Saved Filters</a>

    @if (authService.isAdmin()) {
      <a mat-button routerLink="/admin/import" routerLinkActive="active">Import</a>
    }
  </div>
  <button (click)="themeService.toggle()" [attr.aria-label]="themeService.currentTheme() === 'light' ? 'Switch to dark theme' : 'Switch to light theme'"
          class="theme-toggle-btn"
          mat-button>
    @if (themeService.currentTheme() === 'light') {
      <span class="icon">🌙 Go Dark</span>
    } @else {
      <span class="icon">☀️ Go Light</span>
    }
  </button>
  <button mat-icon-button (click)="authService.logout()" title="Logout" aria-label="Logout">
    <mat-icon>logout</mat-icon>
  </button>

</mat-toolbar>

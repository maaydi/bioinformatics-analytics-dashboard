<mat-card #chartCard appearance="outlined" class="chart-card">
  <header aria-labelledby="scatter-title" class="chart-header-export-png" role="group">
    <div class="header-main">
      <h2 id="scatter-title">{{ messages.title }}</h2>
      <p>{{ messages.hint }}</p>
    </div>

    <div aria-hidden="false" class="header-actions">
      <button
        (click)="exportAsImage()"
        [attr.aria-label]="messages.exportImageLabel"
        class="no-export"
        mat-icon-button
        [title]="messages.exportImage"
        type="button"
      >
        <mat-icon>download</mat-icon>
      </button>
    </div>
  </header>

  <mat-card-content>
    @if (rawLoading()) {
      <p aria-live="polite" class="state-message">{{ messages.loading }}</p>
    } @else if (chartError()) {
      <div aria-live="assertive" class="chart-state chart-state-error" role="alert">
        <p>{{ chartError() }}</p>
        <button (click)="retryChart()" mat-stroked-button type="button">{{ messages.retry }}</button>
      </div>
    } @else if (!scatterData().length) {
      <p aria-live="polite" class="state-message">{{ messages.empty }}</p>
    } @else {
      <div class="plot-wrapper">
        <div
          (chartClick)="onChartClick($event)"
          (chartInit)="onChartInit($event)"
          [options]="chartOptions()"
          class="chart-canvas"
          echarts>
        </div>
      </div>
    }
  </mat-card-content>
</mat-card>

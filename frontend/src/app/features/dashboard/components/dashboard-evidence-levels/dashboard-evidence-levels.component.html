<mat-card appearance="outlined" class="chart-card">
  <header class="chart-header">
    <h2>Evidence Levels</h2>
    <p>Distribution by UniProt evidence category</p>
  </header>

  <div aria-label="Evidence levels" class="rows" role="list">
    @for (item of items; track item.level) {
      <div class="row" role="listitem">
        <p class="row-label">L{{ item.level }} - {{ item.label }}</p>

        <div class="bar-group">
          <div aria-hidden="true" class="row-track">
            <span [class]="item.ratioClass" class="row-fill"></span>
          </div>
          <span class="count">{{ item.count | number }}</span>
        </div>
      </div>
    }
  </div>
</mat-card>

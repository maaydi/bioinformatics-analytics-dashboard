<section [attr.aria-label]="messages.overviewLabel" class="dashboard-page">
  <header class="dashboard-header">
    <h1>{{ messages.title }}</h1>
    <p>{{ messages.description }}</p>
  </header>

  <section [attr.aria-busy]="dashboardKpiCardLoading()" [attr.aria-label]="messages.kpiLabel" class="kpi-grid">
    <app-dashboard-kpi-card-list [(kpiLoading)]="dashboardKpiCardLoading"/>
  </section>

  <section [attr.aria-label]="messages.distributionLabel" class="dual-chart-grid">
    <app-dashboard-length-histogram/>
    <app-dashboard-reviewed-ratio/>
  </section>

  <section [attr.aria-label]="messages.evidenceLabel" class="dual-chart-grid">
    <app-dashboard-keyword-frequency-histogram/>
    <app-dashboard-evidence-levels/>
  </section>

  <section [attr.aria-label]="messages.organismsLabel" class="full-width-row">
    <app-dashboard-top-organisms/>
  </section>
</section>

<div class="page-container">
  <mat-card appearance="outlined" aria-label="Gene search filters" class="filter-card">
    <app-gene-filter (filterChange)="store.searchGene($event)" (filterClear)="store.clearFilters()"
                     [value]="store.activeFilters()"></app-gene-filter>
  </mat-card>
  <mat-card aria-label="Gene search results" class="result-card">
    <div class="result-card__search">
      <app-global-search
        (filterChange)="store.searchGene($event)"
        [filters]="store.activeFilters()"
      ></app-global-search>
    </div>
    <app-genes-table
      (rowClick)="store.selectGeneSummary($event)"
      [data]="store.searchResult()"
      [errorMessage]="store.onErrorMessage()"
      [filters]="store.activeFilters()"
      [loading]="store.loading()"
      (filterRemoved)="store.removeFilter($event)"
    >
    </app-genes-table>
  </mat-card>
</div>

<div class="table-header-actions">
  <div class="label-container">
    <label class="section-label">{{ messages.results(totalGenes()) }}</label>
    <div class="page-summary">
      {{ messages.summary(pageIndex() + 1, totalPages(), totalGenes()) }}
    </div>
  </div>
  <mat-paginator
    (page)="onPageChange($event)"
    [length]="totalGenes()"
    [pageIndex]="pageIndex()"
    [pageSizeOptions]="[50, 100, 200]"
    [pageSize]="pageSize()"
    [attr.aria-label]="messages.paginatorLabel"
  >
  </mat-paginator>
</div>

<section [attr.aria-busy]="loading()" class="table-wrapper">
  @defer (on immediate) {
    <ag-grid-angular
      (gridReady)="onGridReady($event)"
      (gridSizeChanged)="onGridSizeChanged($event)"
      (rowClicked)="onGridRowClicked($event)"
      (sortChanged)="onGridSortChanged($event)"
      [animateRows]="true"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [rowData]="rows()"
      [rowSelection]="rowSelection"
      [suppressCellFocus]="false"
      aria-label="Gene explorer results"
      class="ag-theme-quartz gene-grid"
    ></ag-grid-angular>
  } @placeholder {
    <div aria-live="polite" class="state-overlay">
      <p class="table-state">Loading proteins...</p>
    </div>
  }


  @if (loading()) {
    <div aria-live="polite" class="state-overlay">
      <div class="skeleton-title"></div>
      @for (_ of [1, 2, 3, 4, 5, 6]; track $index) {
        <div class="skeleton-row"></div>
      }
    </div>
  }

  @if (hasError()) {
    <div class="state-overlay" role="alert">
      <p class="error-msg">{{ errorMessage() }}</p>
      <button (click)="retrySearch()" class="retry-button" type="button">Retry</button>
    </div>
  }

  @if (!loading() && !hasError() && !hasRows()) {
    <div aria-live="polite" class="state-overlay">
      <p class="table-state">No proteins found</p>
    </div>
  }
</section>

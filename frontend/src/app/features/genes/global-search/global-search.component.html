<div class="table-header-actions">
  <div class="header-container">
    <div class="label-container">
      <label class="section-label">{{ messages.title }}</label>
      <mat-icon
        class="help-icon"
        [matTooltip]="messages.hint"
        matTooltipPosition="above">
        help_outline
      </mat-icon>
    </div>
    <button (click)="toggleProvider()"
            [attr.aria-label]="dataProviderService.getProvider() === 'postgres' ? messages.switchToRemote : messages.switchToLocal"
            class="theme-toggle-btn"
            mat-button>
      @if (dataProviderService.getProvider() === 'postgres') {
        <span class="icon"><mat-icon>signal_wifi_off</mat-icon>{{ messages.local }}</span>
      } @else {
        <span class="icon"><mat-icon>signal_wifi_4_bar</mat-icon>{{ messages.remote }}</span>

      }
    </button>
  </div>
  <mat-form-field appearance="outline" class="global-search-field">
    <input (input)="onSearchInput($event)"
           [value]="globalSearchValue()"
           matInput
           [placeholder]="messages.placeholder"
    >
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>
  @if (globalSearchValue().length > MAX_GLOBAL_SEARCH_LEN) {
    <p class="error-text">{{ errorMessage() }}</p>
  }
</div>

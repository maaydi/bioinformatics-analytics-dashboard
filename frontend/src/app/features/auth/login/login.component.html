<div class="login-wrapper">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>{{ messages.title }}</mat-card-title>
      <mat-card-subtitle>{{ messages.subtitle }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form (ngSubmit)="onSubmit()" [attr.aria-label]="messages.formLabel" [formGroup]="form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ messages.username }}</mat-label>
          <input autocomplete="username" formControlName="username" matInput required/>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ messages.password }}</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
            required
          />
        </mat-form-field>

        @if (errorMessage(); as message) {
          <p class="error-text" role="alert">{{ message }}</p>
        }

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="full-width"
          [disabled]="form.invalid || loading()"
        >
          {{ loading() ? messages.signingIn : messages.signIn }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>

<mat-card #chartCard appearance="outlined" class="chart-card">
  <header class="chart-header-export-png" role="group">
    <div class="header-main">
    <h2>Reviewed vs Unreviewed Proteins</h2>
    </div>

    <div aria-hidden="false" class="header-actions">
      <button
        (click)="exportAsImage()"
        aria-label="Export chart as image"
        class="no-export"
        mat-icon-button
        title="Export as Image"
        type="button"
      >
        <mat-icon>download</mat-icon>
      </button>
    </div>
  </header>

  @if (loading()) {
    <div class="chart-state">
      <app-loading-spinner/>
    </div>
  } @else if (error()) {
    <div aria-live="assertive" class="chart-state chart-state-error" role="alert">
      <p>{{ error() }}</p>
      <button (click)="retry()" mat-stroked-button type="button">Retry</button>
    </div>
  } @else if (!hasData()) {
    <p aria-live="polite" class="chart-state">No reviewed ratio data available.</p>
  } @else {
    <div class="ratio-layout">
      <div [style.background]="donutBackground()" aria-hidden="true" class="donut"></div>

      <div class="legend-list">
        <button (click)="selectReviewedStatus(true)" class="legend-item reviewed legend-button" type="button">
          <span aria-hidden="true" class="legend-dot"></span>
          Reviewed: {{ formatCount(reviewedCount()) }} ({{ reviewedPercent() }}%)
        </button>
        <button (click)="selectReviewedStatus(false)" class="legend-item unreviewed legend-button" type="button">
          <span aria-hidden="true" class="legend-dot"></span>
          Unreviewed: {{ formatCount(unreviewedCount()) }} ({{ unreviewedPercent() }}%)
        </button>
      </div>
    </div>
  }
</mat-card>

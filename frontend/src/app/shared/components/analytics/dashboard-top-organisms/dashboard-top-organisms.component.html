<mat-card #chartCard appearance="outlined" class="chart-card">
  <header class="chart-header-export-png" role="group">
    <div class="header-main">
    <h2>Top {{ limit() }} Organisms by Protein Count</h2>
    </div>
    <div aria-hidden="false" class="header-actions">
      <app-limit-selector
        (limitChange)="onLimitChanged($event)"
        [defaultValue]="limit()"
        [max]="200"
        [min]="1"
      />
      <button
        (click)="exportAsImage()"
        aria-label="Export chart as image"
        class="no-export"
        mat-icon-button
        title="Export as Image"
        type="button"
      >
        <mat-icon>download</mat-icon>
      </button>
    </div>
  </header>

  @if (loading()) {
    <div class="chart-state">
      <app-loading-spinner/>
    </div>
  } @else if (error()) {
    <div aria-live="assertive" class="chart-state chart-state-error" role="alert">
      <p>{{ error() }}</p>
      <button (click)="retry()" mat-stroked-button type="button">Retry</button>
    </div>
  } @else if (!hasData()) {
    <p aria-live="polite" class="chart-state">No organism distribution data available.</p>
  } @else {
    <ol [aria-label]="'Top '+ limit() +' organisms by protein count'" class="organism-list">
      @for (item of organisms(); track item.name) {
        <li>
          <button (click)="selectOrganism(item.name)" class="organism-row" type="button">
            <span class="name">{{ item.name }}</span>
            <div class="bar-group">
            <span aria-hidden="true" class="track">
              <span [style.width.%]="item.ratioPercent" class="fill"></span>
            </span>
              <span class="count">{{ item.count | number }}</span>
            </div>
          </button>
        </li>
      }
    </ol>
  }
</mat-card>

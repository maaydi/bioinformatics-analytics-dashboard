<mat-card #chartCard appearance="outlined" class="chart-card">
  <header aria-labelledby="evidence-levels-title" class="chart-header-export-png" role="group">
    <div class="header-main">
      <h2>{{ messages.title }}</h2>
      <p>{{ messages.hint }}</p>
    </div>

    <div aria-hidden="false" class="header-actions">
      <button
        (click)="exportAsImage()"
        [attr.aria-label]="messages.exportImageLabel"
        class="no-export"
        mat-icon-button
        [title]="messages.exportImage"
        type="button"
      >
        <mat-icon>download</mat-icon>
      </button>
    </div>
  </header>

  @if (loading()) {
    <div class="chart-state">
      <app-loading-spinner/>
    </div>
  } @else if (error()) {
    <div aria-live="assertive" class="chart-state chart-state-error" role="alert">
      <p>{{ error() }}</p>
      <button (click)="retry()" mat-stroked-button type="button">{{ messages.retry }}</button>
    </div>
  } @else if (!hasData()) {
    <p aria-live="polite" class="chart-state">{{ messages.empty }}</p>
  } @else {
    <div class="chart-layout">
      <div
        [style.background]="pieGradient()"
        aria-hidden="true"
        class="pie-chart"
      ></div>

      <div [attr.aria-label]="messages.chartLabel" class="legend-list" role="list">
        @for (item of items(); track item.level) {
          <button
            (click)="selectEvidenceLevel(item.level)"
            [attr.aria-label]="messages.filterLabel(item.level, item.label)"
            class="legend-row"
            role="menuitem"
            type="button"
          >
            <div class="legend-indicator-group">
              <span [class]="'color-badge ' + item.colorClass"></span>
              <span class="row-label">{{ messages.levelLabel(item.level, item.label) }}</span>
            </div>

            <div class="value-group">
              <span class="count">{{ item.count | number }}</span>
              <span class="percentage">{{ messages.percentage(item.ratioPercent) }}</span>
            </div>
          </button>
        }
      </div>
    </div>
  }
</mat-card>

<section class="section-group">
  @if (label()) {
    <div class="label-container">
      <label class="section-label">{{ label() }}</label>

      @if (hintLabel()) {
        <mat-icon
          [matTooltip]="hintLabel()"
          class="help-icon"
          matTooltipPosition="above">
          help_outline
        </mat-icon>
      }
    </div>
  }

  <div [formGroup]="rangeForm" class="range-row">
    <mat-form-field appearance="outline">
      <input
        (blur)="onTouch()"
        [attr.aria-label]="messages.minLabel(label())"
        [placeholder]="minPlaceholder()"
        [title]="messages.minTitle(label())"
        formControlName="min"
        matInput
        type="number"
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <input
        (blur)="onTouch()"
        [attr.aria-label]="messages.maxLabel(label())"
        [placeholder]="maxPlaceholder()"
        [title]="messages.maxTitle(label())"
        formControlName="max"
        matInput
        type="number"
      />
    </mat-form-field>
  </div>
  @if (isMinGreaterThanMax()) {
    <mat-error class="error-message">{{ messages.invalid }}</mat-error>
  }
</section>
